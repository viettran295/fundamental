services:
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: dragonfly
    ulimits:
      memlock: -1
    command: >
      --maxmemory=2gb 
      --cache_mode=true 
      --log_dir="/var/log/dragonfly"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 2s
      timeout: 3s
      retries: 5

  fundamental:
    # build: .
    image: viettrann/fundamental
    container_name: fundamental
    user: "${UID}:${GID}"
    environment:
      - CACHE_DB_URI=redis://dragonfly:6379
    volumes:
      - ./data:/app/data
    ports:
      - "3000:3000"
    depends_on:
      - dragonfly
