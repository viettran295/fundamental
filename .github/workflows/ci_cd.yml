name: fundamental-ci/cd

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["master"]

jobs:
  style:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy

  tests:
    name: Test ${{ matrix.rust }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        rust: [stable, beta]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - name: Run tests
        run: cargo test --verbose -- --nocapture  --test-threads=4

  build-arm64:
    needs: tests
    name: Build image for amr64
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: |
                CACHE_DB_URI=${{ secrets.CACHE_DB_URI }}
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fundamental:arm64
          
  build-x86_64:
    needs: tests
    name: Build image for x86_64
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: |
                CACHE_DB_URI=${{ secrets.CACHE_DB_URI }}
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fundamental:x86_64

  deploy:
    runs-on: ubuntu-24.04
    needs: [build-arm64]
    permissions:
      contents: read
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_KEY }}
          port: 22
          script: |
            VPS_ARCH=$(uname -m)
            CONTAINER_NAME="fundamental"
            ARM64_IMG="${{ secrets.DOCKER_USERNAME }}/${CONTAINER_NAME}:arm64"
            NETWORK="vtrade-network"
            docker network inspect $NETWORK >/dev/null 2>&1 || \
              docker network create $NETWORK
            if [[ "$VPS_ARCH" == "aarch64" ]]; then
              docker pull $ARM64_IMG
              docker stop $CONTAINER_NAME
              docker rm $CONTAINER_NAME
              docker run -d \
                        --name $CONTAINER_NAME \
                        --network $NETWORK \
                        -e CACHE_DB_URI=redis://dragonfly:6379
                        -p 3000:3000 \
                        $ARM64_IMG
            else
              echo "Unsupported architecture: $VPS_ARCH"
              exit 1
            fi